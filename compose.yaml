services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      # live-edit the application without rebuilding
      - .:/var/www/html
      # keep the image's vendor rather than shadowing it with the host's
      - /var/www/html/vendor
    # Configuration is read from the .env file the mount brings in, not the
    # environment — an `environment:` block here would be ignored.
